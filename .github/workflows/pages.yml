# Publica a landing page no GitHub Pages como ambiente de testes.
# URL: https://fbadia.github.io/seguronamao_lp/
# Ambiente de testes: TODAS as páginas recebem "noindex" para não competir com o
# domínio oficial (https://seguronamao.seg.br), que é o canonical.
name: Publicar no GitHub Pages (testes)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site (somente arquivos públicos)
        run: |
          mkdir -p _site
          cp index.html privacidade.html _site/
          cp -R css js assets _site/

          # Ambiente de testes: impedir indexação (a privacidade já é noindex)
          grep -q 'name="robots"' _site/index.html || \
            sed -i 's|<meta charset="utf-8">|<meta charset="utf-8">\n  <meta name="robots" content="noindex, nofollow">|' _site/index.html
          grep -q 'name="robots"' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
