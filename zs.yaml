# Manifesto de deploy na ZeroServer Community Cloud.
# Referência: https://github.com/zeroserver-cc/demo-apps/blob/main/docs/zs-yaml-reference.md
#
# A ZeroServer não faz build a partir do código: ela roda a imagem já publicada no GHCR.
#
# Deploy normal: crie uma tag vX.Y.Z. O workflow .github/workflows/release.yml gera a
# imagem X.Y.Z, troca a versão abaixo (só dentro do runner) e roda `zs deploy` após aprovação.
#
# A versão abaixo é usada apenas em deploy manual (`zs deploy` local, ex.: rollback).
app: seguronamao-lp

# Preferência (não obrigatória) por nodes no Brasil.
placement:
  country: br

services:
  - name: web
    image: ghcr.io/fbadia/seguronamao-lp:0.1.1
    ports:
      - "8181"
    exposed: true
